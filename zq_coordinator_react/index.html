      // --- GEMINI API CONFIGURATION ---
      const API_KEY = prompt("Enter your Gemini API key:") || ""; // Prompt for key
      const BASE_URL =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

      const callGemini = async (prompt, systemPrompt = "") => {
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: systemPrompt
            ? { parts: [{ text: systemPrompt }] }
            : undefined,
        };

        const fetchWithRetry = async (retries = 5, delay = 1000) => {
          try {
            const response = await fetch(`${BASE_URL}?key=${API_KEY}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok)
              throw new Error(`HTTP error! status: ${response.status}`);
            return await response.json();
          } catch (error) {
            if (retries > 0) {
              await new Promise((res) => setTimeout(res, delay));
              return fetchWithRetry(retries - 1, delay * 2);
            }
            throw error;
          }
        };

        try {
          const result = await fetchWithRetry();
          return (
            result.candidates?.[0]?.content?.parts?.[0]?.text ||
            "No response generated."
          );
        } catch (error) {
          console.error("Gemini API Error:", error);
          return "Error communicating with AI. Please check your connection or system logs.";
        }
      };

              "div",
              {
                className:
                  "p-4 border-b border-white/5 bg-[#181a20]/50 flex items-center justify-between",
              },
              React.createElement(
                "div",
                { className: "flex items-center gap-3" },
                React.createElement(Sparkles, {
                  className: "text-[#7f4fff]",
                  size: 18,
                }),
                React.createElement(
                  "h3",
                  { className: "text-sm font-bold" },
                  "Feedback Agent",
                ),
              ),
              React.createElement(X, {
                size: 18,
                className:
                  "cursor-pointer text-gray-500 hover:text-white transition",
                onClick: () => setIsChatDrawerOpen(false),
              }),
            ),
            React.createElement(
              "div",
              {
                className:
                  "flex-1 overflow-y-auto p-4 space-y-4 scrollbar-custom bg-black/10",
                ref: sideScrollRef,
              },
              feedbackMessages.length === 0
                ? React.createElement(
                    "div",
                    {
                      className:
                        "h-full flex flex-col items-center justify-center text-center p-8 space-y-4",
                    },
                    React.createElement(MessageSquare, {
                      className: "opacity-10",
                      size: 48,
                    }),
                    React.createElement(
                      "p",
                      {
                        className:
                          "text-xs italic text-[#a5adcb]/40 leading-relaxed font-mono",
                      },
                      "Provide secondary context or feedback here to improve the Master Coordinator's logic.",
                    ),
                  )
                : feedbackMessages.map((msg) =>
                    React.createElement(
                      "div",
                      {
                        key: msg.id,
                        className: `flex flex-col ${msg.role === "user" ? "items-end" : "items-start"}`,
                      },
                      React.createElement(
                        "div",
                        {
                          className: `max-w-[90%] px-4 py-2 rounded-2xl text-xs leading-relaxed ${msg.role === "assistant" ? "bg-[#232632] text-[#e8eaf6] border border-white/5 rounded-tl-none" : "bg-[#7f4fff] text-white rounded-tr-none"}`,
                        },
                        msg.content,
                      ),
                      React.createElement(
                        "span",
                        {
                          className:
                            "text-[8px] mt-1 opacity-30 font-mono uppercase",
                        },
                        msg.timestamp,
                      ),
                    ),
                  ),
              isFeedbackLoading &&
                React.createElement(
                  "div",
                  {
                    className:
                      "text-[10px] text-[#7f4fff] animate-pulse font-mono px-2",
                  },
                  "AGENT THINKING...",
                ),
            ),
            React.createElement(
              "div",
              { className: "p-4 border-t border-white/5 bg-[#181a20]" },
              React.createElement(
                "form",
                {
                  onSubmit: (e) => {
                    e.preventDefault();
                    handleFeedbackQuery(feedbackInput);
                  },
                  className: "relative flex items-center",
                },
                React.createElement("input", {
                  type: "text",
                  value: feedbackInput,
                  onChange: (e) => setFeedbackInput(e.target.value),
                  placeholder: "Feedback...",
                  className:
                    "w-full bg-[#1c1e26] border border-white/5 rounded-xl py-3 pl-4 pr-12 text-sm outline-none focus:border-[#7f4fff]/50 transition-all placeholder:text-gray-600",
                }),
                React.createElement(
                  "button",
                  {
                    type: "submit",
                    disabled: !feedbackInput.trim() || isFeedbackLoading,
                    className:
                      "absolute right-2 p-2 rounded-lg text-[#7f4fff] hover:bg-[#7f4fff]/10 disabled:opacity-30",
                  },
                  React.createElement(Send, { size: 18 }),
                ),
              ),
            ),
          ),
        );
      }

      // --- SUPPORT COMPONENTS ---
      function NavItem({ icon: Icon, label, active, collapsed, onClick }) {
        return React.createElement(
          "button",
          {
            onClick,
            className: `w-full flex items-center gap-3 px-3 py-3 rounded-xl transition-all relative ${active ? "bg-[#7f4fff]/10 text-[#7f4fff]" : "text-[#a5adcb] hover:bg-[#232632] hover:text-[#e8eaf6]"}`,
          },
          React.createElement(Icon, { size: 20 }),
          !collapsed &&
            React.createElement(
              "span",
              { className: "font-semibold text-sm" },
              label,
            ),
          active &&
            React.createElement("div", {
              className:
                "absolute right-0 top-1/4 bottom-1/4 w-1 bg-[#7f4fff] rounded-l-full",
            }),
        );
      }

      function ActionChip({ icon: Icon, label, color, onClick }) {
        return React.createElement(
          "button",
          {
            onClick,
            className:
              "flex items-center gap-3 px-6 py-4 bg-[#232632] border border-white/5 rounded-2xl hover:border-white/20 transition-all group text-left",
          },
          React.createElement(Icon, { size: 22, className: color }),
          React.createElement(
            "span",
            { className: "text-sm text-gray-200 font-medium" },
            label,
          ),
        );
      }

      function IconButton({
        icon: Icon,
        onClick,
        color = "hover:bg-[#232632]",
        size = 18,
        badge,
      }) {
        return React.createElement(
          "button",
          {
            onClick,
            className: `p-2 rounded-xl text-[#a5adcb] transition-all relative group ${color}`,
          },
          React.createElement(Icon, { size }),
          badge &&
            React.createElement("div", {
              className:
                "absolute top-1.5 right-1.5 w-2 h-2 bg-[#ff467e] rounded-full border-2 border-[#1c1e26]",
            }),
        );
      }

      // Render the app
      lucide.createIcons();
      ReactDOM.render(
        React.createElement(App),
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
