name: Build EXE and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/feedback-chat-drawer

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-kivy311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-kivy311-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install kivy[base] kivy_deps.sdl2 kivy_deps.glew --extra-index-url https://kivy.org/downloads/simple/
          python -m pip install pandas openpyxl requests pyinstaller

      - name: Build EXE (onedir - faster, zip artifact)
        shell: pwsh
        env:
          KIVY_NO_CONSOLELOG: "1"
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed `
            --name INNM_Taskbox `
            --add-data "ui.kv;." `
            main.py
          Compress-Archive -Path dist\INNM_Taskbox -DestinationPath dist\INNM_Taskbox_win.zip

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INNM_Taskbox_win
          path: dist\INNM_Taskbox_win.zip

  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer global dir
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget curl \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev \
            cmake build-essential libltdl-dev \
            libsqlite3-dev libbz2-dev \
            python3-dev python3-pip \
            ccache patch

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.33"
          python -m pip install buildozer

      - name: Build APK (debug)
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false"
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK_ROOT: /root/.buildozer/android/platform/android-sdk
        run: |
          yes | buildozer android debug 2>&1 | tee buildozer.log
          echo "=== APK files ==="
          ls bin/ 2>/dev/null || echo "No APK found in bin/"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INNM_Taskbox_apk
          path: bin/*.apk
