name: Build EXE and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/feedback-chat-drawer
      - blackboxai/setup-venv-kivy

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up venv and install Kivy dependencies
        shell: bash
        run: |
          python -m venv venv
          venv/Scripts/python -m pip install --upgrade pip
          venv/Scripts/python -m pip install kivy[base] kivy_deps.sdl2 kivy_deps.glew
          venv/Scripts/python -m pip install -r requirements.txt
          venv/Scripts/python -m pip install pyinstaller

      - name: Build EXE
        shell: bash
        run: |
          venv/Scripts/python -m PyInstaller --noconfirm --onefile --windowed \
            --name INNM_Taskbox \
            --add-data "ui.kv;." \
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INNM_Taskbox_exe
          path: dist/INNM_Taskbox.exe

  build-apk:
    # buildozer-action runs inside the official kivy/buildozer Docker image
    # which ships Android SDK 34, NDK r25b, and all required toolchains.
    # No manual Java/Python/NDK/SDK setup needed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Cache the Buildozer global dir to avoid re-downloading SDK/NDK on every run
      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK with buildozer-action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INNM_Taskbox_apk
          path: ${{ steps.buildozer.outputs.filename }}
