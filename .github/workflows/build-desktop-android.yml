name: Build EXE and APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/feedback-chat-drawer

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name INNM_Taskbox \
            --add-data "ui.kv;." \
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: INNM_Taskbox_exe
          path: dist/INNM_Taskbox.exe

  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java and Buildozer system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.33 buildozer

      - name: Build APK (debug)
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: INNM_Taskbox_apk
          path: bin/*.apk
